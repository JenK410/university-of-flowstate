name: Import University source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and unpack source
        run: |
          cat .source-transfer/part-*.txt | base64 --decode > uofs-transfer.tar.gz
          mkdir -p /tmp/uofs-source
          tar -xzf uofs-transfer.tar.gz -C /tmp/uofs-source
          rsync -a --exclude '.git' /tmp/uofs-source/ ./
          rm -rf .source-transfer uofs-transfer.tar.gz
      - name: Commit imported source
        run: |
          git config user.name "University of FlowState Deploy"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -m "Import current University of FlowState source" || exit 0
          git push
